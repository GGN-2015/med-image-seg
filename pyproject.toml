[project]
name = "med-image-seg"
version = "0.1.4"
description = "Interactive polygon annotation for DICOM, NIfTI, and UBD volumes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "GGN_2015", email = "neko@jlulug.org" },
]
dependencies = [
    "ct-mri-dicom-nii-reader",
    "fake-process-estimation>=0.1.0,<0.2",
    "numpy>=1.26,<3",
    "pyside6>=6.8,<7",
    "scipy>=1.13,<2",
    "scikit-image>=0.24,<1",
    "simpleitk>=2.5,<3",
]

[project.scripts]
med-image-seg = "med_image_seg.__main__:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["med_image_seg"]

[tool.hatch.build.targets.sdist]
include = [
    "/med_image_seg",
    "/Tests",
    "/Docs",
    "/.python-version",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["Tests"]
python_files = ["C_Test*.py"]
python_classes = ["C_Test*"]

[tool.pyright]
include = ["med_image_seg", "Tests", "Docs"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["med_image_seg"]
omit = ["med_image_seg/Concrete/Presentation/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "；", "：", "（", "）", "？"]
